<!DOCTYPE html>
<html lang="en" class="theme-midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --text-primary: #f8fafc;
            --accent-color: #3b82f6;
        }

        :root.theme-forest {
            --bg-primary: #1c1917;
            --text-primary: #f5f5f4;
            --accent-color: #22c55e;
        }

        :root.theme-retro {
            --bg-primary: #2e1025;
            --text-primary: #fdf4ff;
            --accent-color: #d946ef;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: sans-serif;
            padding: 20px;
            transition: all 0.5s;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Theme Test</h1>
    <p>Current theme class: <span id="current"></span></p>
    <button onclick="setTheme('midnight')">Midnight</button>
    <button onclick="setTheme('forest')">Forest</button>
    <button onclick="setTheme('retro')">Retro</button>

    <script>
        function setTheme(theme) {
            const root = document.documentElement;
            root.classList.remove('theme-midnight', 'theme-forest', 'theme-retro');
            root.classList.add(`theme-${theme}`);
            document.getElementById('current').textContent = root.className;
        }
        document.getElementById('current').textContent = document.documentElement.className;
    </script>
</body>
</html>
